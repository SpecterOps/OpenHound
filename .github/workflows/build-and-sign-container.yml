name: Build, Sign, and Publish Container Image

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and sign the container image for"
        required: true
        type: string
      prerelease:
        description: "Whether this release is a pre-release (skips the 'latest' tag)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  push-to-docker-registry:
    name: Push Image to Docker Registry (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cli
            suffix: ""
            latest_tag: "latest"
          - target: enterprise
            suffix: "-enterprise"
            latest_tag: "latest-enterprise"
    env:
      DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
      DOCKER_REPOSITORY: ${{ vars.DOCKER_REPOSITORY }}
      DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Set image reference
        id: image-ref
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          CLEAN_VERSION="$RELEASE_TAG"

          if [ -z "$CLEAN_VERSION" ]; then
            echo "Error: version is empty"
            exit 1
          fi

          CLEAN_VERSION="${CLEAN_VERSION#v}"
          VERSION_TAG="$DOCKER_REGISTRY/$DOCKER_REPOSITORY:${CLEAN_VERSION}${{ matrix.suffix }}"

          echo "clean_version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate Metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # ratchet:docker/metadata-action@v5
        with:
          images: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}
          tags: |
            # prerelease
            type=raw,value=${{ steps.image-ref.outputs.clean_version }},suffix=${{ matrix.suffix }},enable=${{ inputs.prerelease }}
            type=sha,format=short,prefix=prerelease-,suffix=${{ matrix.suffix }},enable=${{ inputs.prerelease }}
            # release
            type=raw,value=${{ steps.image-ref.outputs.clean_version }},suffix=${{ matrix.suffix }},enable=${{ ! inputs.prerelease }}
            type=raw,value=${{ matrix.latest_tag }},enable=${{ ! inputs.prerelease }}
            type=sha,format=short,prefix=release-,suffix=${{ matrix.suffix }},enable=${{ ! inputs.prerelease }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # ratchet:aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.BHE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BHE_AWS_SECRET_ACCESS_KEY }}
          aws-region: 'us-east-1'

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # ratchet:aws-actions/amazon-ecr-login@v2

      - name: Login to Docker registry
        run: |
          echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            OPENHOUND_VERSION=${{ steps.image-ref.outputs.clean_version }}

      - name: Persist digest
        run: |
          echo "${{ steps.push.outputs.digest }}" > "${{ runner.temp }}/digest-${{ matrix.target }}.txt"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.target }}
          path: ${{ runner.temp }}/digest-${{ matrix.target }}.txt
          if-no-files-found: error
          retention-days: 7

  sign-docker-image:
    name: Sign Published Image (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: push-to-docker-registry
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cli
          - target: enterprise
    permissions:
      contents: read
      id-token: write
    env:
      COSIGN_YES: "true"
      DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
      DOCKER_REPOSITORY: ${{ vars.DOCKER_REPOSITORY }}
      DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Download digest artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-digest-${{ matrix.target }}
          path: ${{ runner.temp }}

      - name: Read digest
        id: digest
        run: |
          DIGEST="$(cat "${{ runner.temp }}/digest-${{ matrix.target }}.txt")"
          DIGEST_REF="${DOCKER_REGISTRY}/${DOCKER_REPOSITORY}@${DIGEST}"
          echo "digest_ref=$DIGEST_REF" >> "$GITHUB_OUTPUT"

      - name: Login to Docker registry
        run: |
          echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin

      - name: Sign image with Cosign keyless
        run: |
          cosign sign --yes "${{ steps.digest.outputs.digest_ref }}"

  verify-docker-image-trust:
    name: Verify Published Image Signature (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs:
      - push-to-docker-registry
      - sign-docker-image
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cli
          - target: enterprise
    env:
      DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
      DOCKER_REPOSITORY: ${{ vars.DOCKER_REPOSITORY }}
      DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Download digest artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-digest-${{ matrix.target }}
          path: ${{ runner.temp }}

      - name: Read digest
        id: digest
        run: |
          DIGEST="$(cat "${{ runner.temp }}/digest-${{ matrix.target }}.txt")"
          DIGEST_REF="${DOCKER_REGISTRY}/${DOCKER_REPOSITORY}@${DIGEST}"
          echo "digest_ref=$DIGEST_REF" >> "$GITHUB_OUTPUT"

      - name: Login to Docker registry
        run: |
          echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin

      - name: Verify Fulcio keyless signature
        run: |
          cosign verify "${{ steps.digest.outputs.digest_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/.*"
