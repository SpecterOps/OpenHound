name: Run tests
on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

  workflow_call:

permissions:
  contents: read
  id-token: write   # This is required for requesting the JWT for the OIDC provider

jobs:
  test-core:
    runs-on: ubuntu-latest
    # TODO:  add more python versions to tests
    # strategy:
    #   matrix:
    #     python-version: ["3.13"]


    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Create virtual environment
        run: uv venv .venv

      - name: Install dependencies
        run: |
          uv pip install --python .venv -e ".[all]" --group dev

      - name: Run AWS Secrets Manager tests
        run: |
          .venv/bin/pytest tests/test_aws_secrets_manager.py -v

      - name: Run managed configuration and credential handoff tests
        run: |
          .venv/bin/pytest tests/test_managed_configuration.py tests/test_managed_credentials.py -v

      - name: Run log handling tests
        run: |
          .venv/bin/pytest tests/test_log_handlers.py -v

      - name: Run privilege zone selector sync tests
        run: |
          .venv/bin/pytest tests/test_pz_selector_sync.py -v

      - name: Run saved searches sync tests
        run: |
          .venv/bin/pytest tests/test_saved_searches_sync.py -v

      - name: Run extension validation tests
        run: |
          .venv/bin/pytest tests/test_extensions_format.py -v

      - name: Run BHE version boundary tests
        run: |
          .venv/bin/pytest tests/test_bhe_version.py -v

      - name: Run BHE job scheduling test
        run: |
          .venv/bin/pytest tests/test_bhe_job_scheduling.py -v

      - name: Run preprocess lookup generation tests
        run: |
          .venv/bin/pytest tests/test_preproc.py -v

      - name: Run pipeline retry and recovery tests
        run: |
          .venv/bin/pytest tests/test_pipeline_retry.py tests/test_pipeline_recovery.py tests/test_saved_runs.py tests/test_upload_package.py -v

      - name: Run DuckDB lookup exception handling tests
        run: |
          .venv/bin/pytest tests/test_lookup.py -v

      - name: Run collection inventory tests
        run: |
          .venv/bin/pytest tests/test_collection_inventory.py -v

      - name: Run DLT Pydantic exception handling (override) test
        run: |
          .venv/bin/pytest tests/test_dlt_pydantic_override.py -v

      - name: Run tests for our custom implemenation of AsyncRESTClient
        run: |
          .venv/bin/pytest tests/rest_client -v

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.0.0

      - name: Validate Helm persistence configuration
        run: |
          helm lint deployments/helm/openhound -f deployments/helm/values.example.yaml --strict
          .venv/bin/pytest tests/test_helm_persistence.py -v
