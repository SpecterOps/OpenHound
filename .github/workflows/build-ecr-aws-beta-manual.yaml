name: Push Bundled OpenHound + AWS Beta Image to ECR
run-name: AWS beta bundle — ${{ inputs.tag }} — ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Development version, e.g. 0.4.1.dev9346005 (without ecr-enterprise)"
        required: true
        type: string
      aws_commit:
        description: "Full 40-character openhound-aws source commit SHA to bundle"
        required: true
        type: string
      verify_access_only:
        description: "Only verify read access to SpecterOps/openhound-aws; skip ECR publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-openhound-aws-access:
    name: Verify read access to openhound-aws
    if: ${{ inputs.verify_access_only == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Create read token for openhound-aws
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: SpecterOps
          repositories: openhound-aws
          permission-contents: read

      - name: Check out openhound-aws
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # ratchet:actions/checkout@v6
        with:
          repository: SpecterOps/openhound-aws
          ref: ${{ inputs.aws_commit }}
          token: ${{ steps.app-token.outputs.token }}
          path: repo-b
          persist-credentials: false

      - name: Confirm checked out revision
        run: git -C repo-b rev-parse --verify HEAD

  push-to-ECR-registry:
    name: Push bundled enterprise image to ECR
    if: ${{ inputs.verify_access_only != true }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenHound source and bundle build tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # ratchet:actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false

      - name: Generate Metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # ratchet:docker/metadata-action@v5
        with:
          images: |
            ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}
          tags: |
            type=raw,prefix=ecr-enterprise,value=${{ inputs.tag }},enable=true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # ratchet:docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # ratchet:docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # ratchet:aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.BHE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BHE_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # ratchet:aws-actions/amazon-ecr-login@v2

      - name: Create read token for openhound-aws
        id: openhound-aws-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: SpecterOps
          repositories: openhound-aws
          permission-contents: read

      - name: Build and push bundled multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # ratchet:docker/build-push-action@v7
        with:
          context: ./source
          file: ./source/Dockerfile.aws-bundle
          target: enterprise
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            OPENHOUND_VERSION=${{ inputs.tag }}
            OPENHOUND_AWS_COMMIT=${{ inputs.aws_commit }}
          secrets: |
            OPENHOUND_AWS_APP_TOKEN=${{ steps.openhound-aws-token.outputs.token }}
