# Example configuration: https://bloodhound.specterops.io/openhound/enterprise#full-configuration-example
[openhound]
managed = false

# Managed deployments read BHE HMAC credentials from AWS Secrets Manager rather
# than secrets.toml. The named secret must be a JSON object with token_id and
# token_key fields. poll_interval controls the BHE scheduler cadence in seconds.
# [openhound.aws_secrets_manager]
# secret_name = "openhound/bhe-credentials"
# poll_interval = 30

[runtime]
http_show_error_body = true
log_cli_level = "WARNING"
log_rotate_when = "midnight"

# HTTP retry/backoff for source requests; rides out API rate limits
# (e.g. GitHub during large collections) instead of failing the run.
request_max_attempts = 15
request_backoff_factor = 1.3
request_max_retry_delay = 900

# Self-managed mode defaults to human-readable text; managed mode defaults to
# structured JSON. To override either default, uncomment the line below (DLT
# requires the value to be uppercase "JSON").
# log_format = "JSON"

# BHE destination URL (non-sensitive; tokens go in secrets.toml)
[destination.bloodhoundenterprise]
url = "bhe_url"

[extract]
workers = 8

[normalize]
workers = 3

[load]
delete_completed_jobs = true
truncate_staging_dataset = true
